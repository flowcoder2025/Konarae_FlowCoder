# PgBouncer client HBA (auth_type = hba). Installed by install.sh to
# /home/ubuntu/flowmate-db/pgbouncer/pgbouncer_hba.conf (uid 70, 600).
#
# Public port 6432 serves exactly one thing: flowmate_app -> database flowmate,
# over TLS, with SCRAM. Every other user/database is rejected.
# Note: PgBouncer looks the user up BEFORE applying these rules, so an unknown user
# (e.g. postgres, flowmate_owner) still costs one auth_query round trip to
# pgbouncer.get_auth(), which returns no row for them ("no such user").
# This file matters for pgbouncer_auth: it is listed in userlist.txt (plaintext,
# needed for its own server login), so without it pgbouncer_auth could log in
# through 6432 and call pgbouncer.get_auth() ("login rejected" with this file).
#
# TYPE   DATABASE  USER          ADDRESS     METHOD
hostssl  flowmate  flowmate_app  0.0.0.0/0   scram-sha-256
hostssl  flowmate  flowmate_app  ::/0        scram-sha-256
host     all       all           0.0.0.0/0   reject
host     all       all           ::/0        reject
local    all       all                       reject
