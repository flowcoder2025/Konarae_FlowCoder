# PgBouncer client HBA (auth_type = hba). Installed by install.sh to
# /home/ubuntu/flowmate-db/pgbouncer/pgbouncer_hba.conf (uid 70, 600).
#
# Public port 6432 serves exactly one thing: flowmate_app -> database flowmate,
# over TLS, with SCRAM. Everyone else is rejected here, before any auth lookup.
# This matters for pgbouncer_auth: it is listed in userlist.txt (plaintext, needed
# for its own server login), so without this file it could log in through 6432
# and call pgbouncer.get_auth(). postgres / flowmate_owner are additionally
# unknown to auth_query (pgbouncer.get_auth returns only flowmate_app).
#
# TYPE   DATABASE  USER          ADDRESS     METHOD
hostssl  flowmate  flowmate_app  0.0.0.0/0   scram-sha-256
hostssl  flowmate  flowmate_app  ::/0        scram-sha-256
host     all       all           0.0.0.0/0   reject
host     all       all           ::/0        reject
local    all       all                       reject
