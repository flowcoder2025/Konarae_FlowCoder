# FlowMate Postgres main config. Mounted read-only at /etc/postgresql/postgresql.conf
# and selected with `postgres -c config_file=...` (docker-compose.yml). The initdb
# generated $PGDATA/postgresql.conf is NOT read. Data directory comes from PGDATA.
#
# Base values mirror initdb defaults and the Supabase source (checked 2026-11-02:
# DateStyle ISO, MDY / lc_* en_US.UTF-8 / TimeZone UTC). Tuning and security
# settings live in conf.d/flowmate.conf.

hba_file = '/etc/postgresql/pg_hba.conf'

listen_addresses = '*'          # container-internal; host exposure is 127.0.0.1:5433 only
port = 5432
max_connections = 100
unix_socket_directories = '/var/run/postgresql'

dynamic_shared_memory_type = posix
max_wal_size = 1GB
min_wal_size = 80MB

timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

include_dir = 'conf.d'          # relative to this file: /etc/postgresql/conf.d
