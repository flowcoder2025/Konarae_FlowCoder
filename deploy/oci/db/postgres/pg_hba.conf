# FlowMate pg_hba.conf (mounted read-only at /etc/postgresql/pg_hba.conf).
# First match wins. Addresses come from docker-compose.yml network `flowmate`:
#   172.21.0.1  docker gateway: how 127.0.0.1:5433 (SSH tunnel) connections appear
#               (docker-proxy; verified empirically at install, see README)
#   172.21.0.2  flowmate-db
#   172.21.0.3  flowmate-pgbouncer
#   172.21.0.0/24  flowmate network (pgbouncer, workers after cutover)
#
# TYPE  DATABASE  USER            ADDRESS          METHOD

# Superuser: local socket only (docker exec -u postgres). Never over TCP.
local   all       postgres                         peer
local   all       all                              reject
host    all       postgres        0.0.0.0/0        reject
host    all       postgres        ::/0             reject

# PgBouncer's auth_query user, only from the pgbouncer container.
host    flowmate  pgbouncer_auth  172.21.0.3/32    scram-sha-256

# Schema owner (restore, prisma db push): only via the loopback-published port.
host    flowmate  flowmate_owner  172.21.0.1/32    scram-sha-256

# Application role: pgbouncer and workers on the flowmate network.
host    flowmate  flowmate_app    172.21.0.0/24    scram-sha-256

# Everything else.
host    all       all             0.0.0.0/0        reject
host    all       all             ::/0             reject
