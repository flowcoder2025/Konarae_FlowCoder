# FlowMate tuning + security (OCI A1, 2 OCPU / 12GB shared with other services).

password_encryption = 'scram-sha-256'

# Memory: the VM also runs workers, umami, n8n. Keep shared_buffers <= 1GB.
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB

# Logging. log_statement must stay 'none': statement logging would capture
# ALTER ROLE ... PASSWORD. roles.sql additionally disables error/duration
# statement logging for its own session.
log_statement = 'none'
log_min_duration_statement = 1000
# Never log bind parameter values (slow-statement and error logs would otherwise
# contain e.g. Account OAuth tokens and session tokens).
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_connections = on
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '
