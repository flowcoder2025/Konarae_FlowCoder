# jest on every PR and on main, including the DB integration suites
# (admin login throttle/authorize) against a disposable Postgres.
# Vercel builds (tsc + lint) stay the other check; this one has no secrets.

name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share a group per PR and cancel superseded runs. Push and dispatch
  # runs get a group per commit (a group keeps only one waiting run), so every
  # main commit keeps its own result.
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jest:
    name: jest (disposable Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Same image as production (deploy/oci/db): Postgres 17 + pgvector, ICU 76.
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: flowmate_test
        ports:
          # The tests only accept a loopback URL that is not on 5433 (disposable-db.ts).
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Push the schema to the disposable database
        run: pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:test@127.0.0.1:55432/flowmate_test
          DIRECT_URL: postgresql://postgres:test@127.0.0.1:55432/flowmate_test

      - name: jest
        run: pnpm exec jest --ci --json --outputFile=jest-results.json
        env:
          ADMIN_LOGIN_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:55432/flowmate_test

      # A skipped suite passes jest. Every jest suite must run here, including
      # the ones gated on a database or a pty, and those must still be picked
      # up by testMatch (a renamed file would vanish without a skip).
      - name: No skipped or todo tests
        run: |
          node <<'EOF'
          const path = require("node:path");
          const r = require("./jest-results.json");
          const gated = [
            "__tests__/lib/admin-login/authorize.integration.test.ts",
            "__tests__/lib/admin-login/throttle.integration.test.ts",
            "__tests__/scripts/hash-admin-password.test.ts",
          ];
          const ran = new Map(r.testResults.map((t) => [path.relative(process.cwd(), t.name), t]));
          const missing = gated.filter((f) => {
            const t = ran.get(f);
            return !t || t.status !== "passed" || t.assertionResults.length === 0;
          });
          const counts = {
            total: r.numTotalTests,
            passed: r.numPassedTests,
            pending: r.numPendingTests,
            todo: r.numTodoTests,
            pendingSuites: r.numPendingTestSuites,
          };
          console.log("jest:", JSON.stringify(counts));
          if (!r.numTotalTests || r.numPendingTests || r.numTodoTests || r.numPendingTestSuites) {
            console.error("::error::jest skipped tests or ran none; every suite must run in CI");
            process.exit(1);
          }
          if (missing.length) {
            console.error(`::error::gated suites did not run and pass: ${missing.join(", ")}`);
            process.exit(1);
          }
          EOF
